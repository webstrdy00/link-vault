name: Database contracts

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Startup-only synthetic OAuth configuration; no external provider calls.
      GOOGLE_WEB_CLIENT_ID: ci-fixture.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-fixture-not-a-real-google-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start disposable local database and apply migrations
        run: npx --no-install supabase start --exclude studio,imgproxy,realtime,logflare,vector,supavisor,edge-runtime
      - name: Execute pgTAP contracts
        run: npm run test:db
      - name: Remove disposable stack
        if: always()
        run: npx --no-install supabase stop --no-backup
